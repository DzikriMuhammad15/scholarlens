[project]
name = "scholarlens"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]   # error, pyflakes, urutan import, bugbear, modernisasi sintaks

[tool.mypy]
strict = true
files = ["packages"]

[tool.pytest.ini_options]
pythonpath = ["packages/core"]
testpaths = ["packages/core/tests"]